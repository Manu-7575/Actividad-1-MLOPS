version = "0.1.0"
description = "Actividad 1: Fundamentos, versionamiento y seguimiento"
authors = ["Emmanuel Marin - Jose Figueroa - Juan Rodriguez>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
